name: Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to be released"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          sdk_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "$RELEASE_VERSION" != "$sdk_version" ]]; then
            echo "Release version $RELEASE_VERSION does not match SDK version $sdk_version." >&2
            exit 1
          fi

      - name: Assemble Release
        run: ./gradlew :notifly:assembleRelease --no-daemon

      - name: Dry Run - Publish to Maven Local
        env:
          GROUP: com.github.team-michael.notifly-android-sdk
          VERSION: ${{ github.event.inputs.version }}
          MAVEN_ROOT_ARTIFACT_ID: core-metadata
          MAVEN_JVM_ARTIFACT_ID: core
        run: |
          ./notifly-kmp-sdk/gradlew -p notifly-kmp-sdk publishJvmPublicationToMavenLocal --no-daemon
          ./gradlew :notifly:publishReleasePublicationToMavenLocal --no-daemon

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Determine release type
        id: release_type
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # Build metadata does not make a version a prerelease.
          version_without_build="${VERSION%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Changelog
        id: read_changelog
        if: "!endsWith(github.event.inputs.version, 'SNAPSHOT')"
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ github.event.inputs.version }}

      - name: Create Release
        if: steps.read_changelog.outputs.changes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          commit: ${{ github.sha }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ steps.read_changelog.outputs.changes }}
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Wait for JitPack to recognize the new tag
      - name: Wait for 60 seconds
        run: sleep 60

      - name: Trigger JitPack Build
        run: |
          JITPACK_BUILD_URL="https://jitpack.io/com/github/team-michael/notifly-android-sdk/${{ github.event.inputs.version }}/build.log"
          echo "Triggering JitPack build for ${{ github.event.inputs.version }}"
          MAX_RETRIES=10
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${JITPACK_BUILD_URL}?ts=$(date +%s)")
            if [[ $HTTP_STATUS =~ ^[23][0-9][0-9]$ ]]; then
              echo "JitPack build triggered successfully for version ${{ github.event.inputs.version }}."
              exit 0
            elif [ $HTTP_STATUS -eq 404 ]; then
              echo "Received 404 error. Retrying in 5 seconds..."
              sleep 5
              RETRY_COUNT=$((RETRY_COUNT+1))
            else
              echo "Received unexpected HTTP status code: $HTTP_STATUS"
              exit 1
            fi
          done

          echo "Failed to trigger JitPack build after $MAX_RETRIES attempts."
          exit 1

      - name: Notify Build Trigger
        if: success()
        run: echo "JitPack build triggered successfully for version ${{ github.event.inputs.version }}."

      - name: Notify Build Trigger Failure
        if: failure()
        run: echo "Failed to trigger JitPack build for version ${{ github.event.inputs.version }}."
